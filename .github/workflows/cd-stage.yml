name: CD - Deploy to Stage

on:
  push:
    # branches:
    #   - main

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Stop and remove old containers and volumes
        run: docker compose down -v --remove-orphans || true

      - name: Clean up Docker System (Aggressive cleanup)
        run: docker system prune -a -f --volumes

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: sleep 20

      - name: Run migrations
        run: docker compose exec -T subscription npm run subscription:migration

      - name: Show deployment info
        run: |
          echo "================================================"
          echo "✅ Deployed version: ${GITHUB_SHA::7}"
          echo "📝 Commit: ${{ github.event.head_commit.message }}"
