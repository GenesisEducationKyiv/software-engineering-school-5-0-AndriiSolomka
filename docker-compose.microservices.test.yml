networks:
  dev-network-test:
    driver: bridge
  weather-api-test:
    driver: bridge

services:
  redis-test:
    container_name: redis-test
    image: redis:7-alpine
    restart: always
    ports:
      - 6380:6379
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    networks:
      - weather-api-test

  db-test:
    container_name: db-test
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - apps/subscription/.env.test
    ports:
      - 5435:5432
    user: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d postgres']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - weather-api-test

  weather-test:
    container_name: weather-test
    build:
      context: .
      dockerfile: apps/weather/Dockerfile.test
    env_file:
      - apps/weather/.env.test
    ports:
      - '50051:5051'
    depends_on:
      redis-test:
        condition: service_started
    networks:
      - weather-api-test
    command: ['npm', 'run', 'test:integration']

  subscription-test:
    container_name: subscription-test
    build:
      context: .
      dockerfile: apps/subscription/Dockerfile.test
    env_file:
      - apps/subscription/.env.test
    ports:
      - '50052:5052'
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - weather-api-test
    command: sh -c "npx prisma migrate deploy --schema ./apps/subscription/prisma/schema.prisma && npm run test:integration"
