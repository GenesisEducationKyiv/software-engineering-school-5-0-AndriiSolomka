volumes:
  postgres-db:
  redis-data:

networks:
  dev-network:
    driver: bridge
  weather-api:
    driver: bridge

services:
  db:
    container_name: db
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    volumes:
      - postgres-db:/var/lib/postgresql/data
    ports:
      - 5434:5432
    user: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - weather-api
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    networks:
      - weather-api

  weather:
    container_name: weather
    build:
      context: .
      dockerfile: apps/weather/Dockerfile
    env_file:
      - apps/weather/.env
    ports:
      - '5051:5051'
    depends_on:
      redis:
        condition: service_started
    networks:
      - weather-api

  subscription:
    container_name: subscription
    build:
      context: .
      dockerfile: apps/subscription/Dockerfile
    env_file:
      - apps/subscription/.env
    ports:
      - '5052:5052'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - weather-api

  notification:
    container_name: notification
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    env_file:
      - apps/notification/.env
    ports:
      - '5053:5053'
    depends_on:
      weather:
        condition: service_started
      subscription:
        condition: service_started
      email:
        condition: service_started
    networks:
      - weather-api

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file:
      - apps/gateway/.env
    ports:
      - '5055:5055'
    depends_on:
      weather:
        condition: service_started
      subscription:
        condition: service_started
    networks:
      - weather-api

  email:
    container_name: email
    build:
      context: .
      dockerfile: apps/email/Dockerfile
    env_file:
      - apps/email/.env
    ports:
      - '5054:5054'
    networks:
      - weather-api
