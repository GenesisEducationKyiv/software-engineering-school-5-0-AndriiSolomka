syntax = "proto3";

package email;

service EmailService {
  rpc SendConfirmationEmail (SendConfirmationEmailRequest) returns (SuccessResponse);
  rpc SendWeatherEmail (SendWeatherEmailRequest) returns (SuccessResponse);
}

message SendConfirmationEmailRequest {
  string email = 1;
  string token = 2;
}

message SendWeatherEmailRequest {
  string email = 1;
  string subject = 2;
  string text = 3;
}

message SuccessResponse {
  bool success = 1;
}

