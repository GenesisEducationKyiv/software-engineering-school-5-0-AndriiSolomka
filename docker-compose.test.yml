networks:
  dev-network-test:
    driver: bridge
  weather-api-test:
    driver: bridge

services:
  redis-test:
    container_name: redis-test
    image: redis:7-alpine
    restart: always
    ports:
      - 6380:6379
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    networks:
      - weather-api-test

  db-test:
    container_name: db-test
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - apps/subscription/.env.test
    ports:
      - 5435:5432
    user: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d postgres']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - weather-api-test

  weather-test:
    container_name: weather-test
    build:
      context: .
      dockerfile: apps/weather/Dockerfile.test
    env_file:
      - apps/weather/.env.test
    ports:
      - '30001:3001'
      - '50051:5051'
    depends_on:
      redis-test:
        condition: service_started
    networks:
      - weather-api-test

  subscription-test:
    container_name: subscription-test
    build:
      context: .
      dockerfile: apps/subscription/Dockerfile.test
    env_file:
      - apps/subscription/.env.test
    ports:
      - '50052:5052'
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - weather-api-test

  email-test:
    container_name: email-test
    build:
      context: .
      dockerfile: apps/email/Dockerfile.test
    env_file:
      - apps/email/.env.test
    ports:
      - '50054:5054'
    networks:
      - weather-api-test

  gateway-test:
    container_name: gateway-test
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.test
    env_file:
      - apps/gateway/.env.test
    ports:
      - '50055:5055'
    depends_on:
      email-test:
        condition: service_started
      subscription-test:
        condition: service_started
      weather-test:
        condition: service_started
    networks:
      - weather-api-test

  notification-test:
    container_name: notification-test
    build:
      context: .
      dockerfile: apps/notification/Dockerfile.test
    env_file:
      - apps/notification/.env.test
    ports:
      - '50053:5055'
    depends_on:
      email-test:
        condition: service_started
      subscription-test:
        condition: service_started
      weather-test:
        condition: service_started
    networks:
      - weather-api-test

  test-runner:
    image: node:22.13.0
    container_name: test-runner
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - apps/subscription/.env.test
      - apps/weather/.env.test
      - apps/email/.env.test
      - apps/gateway/.env.test
      - apps/notification/.env.test
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_started
      weather-test:
        condition: service_started
      subscription-test:
        condition: service_started
      email-test:
        condition: service_started
      gateway-test:
        condition: service_started
      notification-test:
        condition: service_started
    command:
      ['sh', '-c', 'npm run subscription:migration', 'npm run test:integration']
    networks:
      - weather-api-test
